<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CuidaValpo | Reporte Patrimonial</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand fw-bold">🏛️ CuidaValpo</span>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">

                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">Registro y pre-diagnóstico de daños</h4>
                    </div>

                    <div class="card-body">
                        <form method="POST">
                            {% csrf_token %}

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Dirección</label>
                                <input type="text" name="direccion" class="form-control"
                                       placeholder="Ej: Cerro Alegre, Valparaíso" required>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Sector</label>
                                <select name="sector" class="form-select" required>
                                    <option value="" selected disabled>Selecciona tu sector</option>
                                    {% for valor, nombre in sectores %}
                                        <option value="{{ valor }}">{{ nombre }}</option>
                                    {% endfor %}
                                </select>
                            </div>
    
                            <div class="mb-4">
                                <label class="form-label fw-semibold">Descripción del daño</label>
                                <textarea name="descripcion" class="form-control" rows="3" required></textarea>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-semibold">Ubica tu vivienda en el mapa (Opcional)</label>
                                <p class="text-muted small mb-1">Haz clic en el mapa para colocar un pin exacto.</p>
                                <div id="mapa_valpo" style="height: 300px; border-radius: 8px; border: 1px solid #ccc;"></div>
                                <input type="hidden" name="latitud" id="latitud">
                                <input type="hidden" name="longitud" id="longitud">
                            </div>

                            <h5 class="mb-3">Cuestionario</h5>

                            <div class="form-check mb-2">
                                <input class="form-check-input" type="checkbox" name="grieta_visible" id="grieta_visible">
                                <label class="form-check-label" for="grieta_visible">¿Hay grietas visibles en muros o fachada?</label>
                            </div>
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="checkbox" name="grieta_cambio" id="grieta_cambio">
                                <label class="form-check-label" for="grieta_cambio">¿Alguna grieta ha crecido en las últimas semanas?</label>
                            </div>
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="checkbox" name="deformacion" id="deformacion">
                                <label class="form-check-label" for="deformacion">¿Ves muros inclinados o pisos hundidos?</label>
                            </div>
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="checkbox" name="desprendimiento" id="desprendimiento">
                                <label class="form-check-label" for="desprendimiento">¿Se han desprendido trozos de fachada?</label>
                            </div>
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="checkbox" name="filtracion" id="filtracion">
                                <label class="form-check-label" for="filtracion">¿Hay filtraciones o manchas de humedad?</label>
                            </div>
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="checkbox" name="antiguedad" id="antiguedad">
                                <label class="form-check-label" for="antiguedad">¿La vivienda tiene más de 50 años?</label>
                            </div>
                            <div class="form-check mb-4">
                                <input class="form-check-input" type="checkbox" name="zona_patrimonial" id="zona_patrimonial">
                                <label class="form-check-label" for="zona_patrimonial">¿Tu casa está en una zona patrimonial?</label>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg">Enviar Reporte</button>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>
    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('mapa_valpo').setView([-33.0435, -71.6260], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        var marcador;
        map.on('click', function(e) {
            var lat = e.latlng.lat;
            var lng = e.latlng.lng;
            if (marcador) {
                map.removeLayer(marcador);
            }
            marcador = L.marker([lat, lng]).addTo(map);
            document.getElementById('latitud').value = lat;
            document.getElementById('longitud').value = lng;
        });
    </script>

</body>
</html>
